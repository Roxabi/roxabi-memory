[project]
name = "roxabi-vault"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["aiosqlite>=0.22.1", "roxabi-nats>=0.1.0"]

[project.optional-dependencies]
cli = ["typer>=0.24.1", "rich>=15.0.0"]
embeddings = ["fastembed>=0.8.0", "sqlite-vec>=0.1.9"]

[project.scripts]
vault = "roxabi_vault.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roxabi_vault"]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.uv.sources]
roxabi-nats = { git = "https://github.com/Roxabi/lyra.git", subdirectory = "packages/roxabi-nats", tag = "roxabi-nats/v0.1.0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
