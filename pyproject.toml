[project]
name = "roxabi-vault"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiosqlite>=0.22.1"]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=15.0.0"]
embeddings = ["fastembed>=0.4", "sqlite-vec>=0.1"]

[project.scripts]
vault = "roxabi_vault.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roxabi_vault"]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
