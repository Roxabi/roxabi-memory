[project]
name = "roxabi-memory"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiosqlite>=0.20"]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4", "sqlite-vec>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roxabi_memory"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
